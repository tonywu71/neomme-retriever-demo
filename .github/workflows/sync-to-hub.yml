name: Sync to Hugging Face Hub

# GitHub is the source of truth and the Space is the deploy target, so every push to main is copied over.
# Changes under .github are skipped because hub-sync never uploads that directory, which would make the sync a
# no-op that restarts the Space for nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/**']
  workflow_dispatch:

# Two pushes close together would otherwise race, and the Space would end up matching whichever upload finished
# last rather than the newer commit.
concurrency:
  group: sync-to-hub
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: tonywu71/neomme-retriever-demo
          hf_token: ${{ secrets.HF_TOKEN }}
