name: Sync to Hugging Face Hub

# Deliberately manual for now: uncomment the `push` block below once the Space is known to build and run, so that
# every merge to main mirrors automatically. Until then this only fires from the Actions tab.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: tonywu71/neomme-retriever-demo
          hf_token: ${{ secrets.HF_TOKEN }}
